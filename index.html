<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Inventaris TEI SMK MUTU KEMLAGI</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0F17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inventaris TEI">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Immediate Theme Initializer -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('INVENTARIS_THEME') || 'auto';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body>

  <!-- ================= PURE LOGIN LANDING PAGE ================= -->
  <div id="screen-login" class="login-screen-wrapper">
    <!-- Theme Toggle Switcher -->
    <div class="login-theme-switch-wrap">
      <button type="button" class="btn-icon theme-toggle-btn" id="btn-theme-toggle" title="Ubah Tema (Gelap / Terang / Otomatis)">
        <i class="ph-bold ph-moon-stars"></i>
      </button>
    </div>

    <div class="login-card">
      <div class="login-header">
        <div class="login-logo-icon">
          <img src="asset/image/logo-smkmutu.webp" alt="Logo SMK Muhammadiyah 1 Kemlagi">
        </div>
        <h2>Inventaris TEI</h2>
        <p class="login-subtitle">SMK Muhammadiyah 1 Kemlagi (SMK MUTU KEMLAGI)</p>
        <span class="badge-status-system" style="margin-top: 10px;">
          <span class="pulse-dot"></span>
          <span>Bengkel Elektronika Industri • TA 2026/2027</span>
        </span>
      </div>

      <form id="form-login-landing">
        <div class="form-group">
          <label><i class="ph-bold ph-envelope-simple"></i> Email / Username <span class="required">*</span></label>
          <input type="text" id="login-landing-email" placeholder="Masukkan email atau 'guest'" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label><i class="ph-bold ph-lock-key"></i> Password <span class="required">*</span></label>
          <input type="password" id="login-landing-password" placeholder="Masukkan password" autocomplete="current-password" required>
        </div>

        <div style="display: flex; justify-content: center; margin-top: 18px;">
          <button type="submit" class="btn btn-primary" style="padding: 12px 40px; font-size: 1rem; font-weight: 600; min-width: 160px; justify-content: center;">
            <i class="ph-bold ph-sign-in"></i> Masuk
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/app-text.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
